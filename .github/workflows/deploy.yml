name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Copy web assets to Android
        run: npx cap copy android > cap-copy-log.txt 2>&1
        continue-on-error: true

      - name: Update Android plugins
        run: npx cap update android > cap-update-log.txt 2>&1
        continue-on-error: true

      - name: Commit and Push Logs
        run: |
          git config --local user.email "bot@antigravity.ai"
          git config --local user.name "Antigravity Bot"
          git add cap-copy-log.txt cap-update-log.txt || true
          git commit -m "Debug logs for cap commands" || true
          git push origin main
