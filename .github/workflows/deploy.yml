name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease > gradle-log.txt 2>&1 || true

      - name: Push log if failed
        run: |
          git config --local user.email "bot@antigravity.ai"
          git config --local user.name "Antigravity Bot"
          git fetch origin main
          git checkout main
          git pull origin main --rebase
          cp android/gradle-log.txt gradle-error-log.txt
          git add gradle-error-log.txt
          git commit -m "Update gradle error log" || true
          git push origin main
          
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.mathx.mastermind
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
