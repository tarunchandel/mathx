name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*' # Trigger on release tags (e.g., v1.0.0)
  workflow_dispatch: # Enable manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor
        run: |
          npx cap sync android > sync-log.txt 2>&1

      - name: Build Release Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease > ../gradle-log.txt 2>&1

      - name: Commit and Push Logs on Failure
        if: failure()
        run: |
          git config --local user.email "bot@antigravity.ai"
          git config --local user.name "Antigravity Bot"
          git checkout -b debug-logs || git checkout debug-logs
          git add sync-log.txt gradle-log.txt || true
          git commit -m "Build logs on failure" || true
          git push origin debug-logs --force || true

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.mathx.mastermind
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal # Deploy to internal test track first
          status: completed
